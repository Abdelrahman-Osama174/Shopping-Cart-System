server:
  port: 8080

spring:
  application:
    name: Shopping Cart System

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopping_cart}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  flyway:
      enabled: false
      locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    token-expiration: 3600000    # 1 hour in milliseconds